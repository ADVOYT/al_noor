<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تقرير الدرجات الشهري</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#F5F7F4] p-4 md:p-10 font-['Tajawal']">

    <div class="max-w-5xl mx-auto bg-white p-8 rounded-3xl shadow-xl">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <a href="index.html" class="bg-gray-100 px-6 py-2 rounded-full hover:bg-gray-200 transition">⬅ العودة للرئيسية</a>
            <h1 class="text-3xl font-bold text-[#2D3C59]">📊 تقرير درجات الطالبات (شهري)</h1>
            <button onclick="window.print()" class="bg-[#2D3C59] text-white px-8 py-2 rounded-full hover:bg-opacity-90 shadow-lg">🖨️ طباعة التقرير</button>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-right border-collapse">
                <thead>
                    <tr class="bg-[#94A378] text-white">
                        <th class="p-4 rounded-tr-lg">اسم الطالبة</th>
                        <th class="p-4">الحضور (10)</th>
                        <th class="p-4">المراجعة (15)</th>
                        <th class="p-4">الاختبار (25)</th>
                        <th class="p-4 rounded-tl-lg">المجموع (50)</th>
                    </tr>
                </thead>
                <tbody id="reportTable" class="divide-y divide-gray-100">
                    </tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
