<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>🌳 لوحة شجرة الإنجاز</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#F5F7F4] min-h-screen p-4 md:p-8 font-['Tajawal']">

    <nav class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center mb-10 bg-white p-6 rounded-3xl shadow-sm gap-4">
        <a href="index.html" class="bg-gray-100 px-5 py-2 rounded-xl text-gray-700 hover:bg-gray-200 transition">⬅ الرئيسية</a>
        
        <div class="flex bg-gray-50 p-2 rounded-2xl border border-gray-200 w-full md:w-auto">
            <input type="text" id="studentNameInput" placeholder="اسم الطالبة أو المجموعة..." 
                   class="bg-transparent border-none focus:ring-0 px-4 py-2 w-full md:w-64 text-right">
            <button onclick="addTreeFromInput()" class="bg-[#94A378] text-white px-6 py-2 rounded-xl hover:bg-opacity-90 shadow-md whitespace-nowrap">
                ➕ إضافة شجرة
            </button>
        </div>
    </nav>

    <div id="treesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10 max-w-7xl mx-auto">
        </div>

    <script src="app.js"></script>
</body>
</html>
